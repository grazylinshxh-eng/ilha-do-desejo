name: Gerar APK Android

on:
  workflow_dispatch:
  push:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar projeto
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Android SDK
        uses: android-actions/setup-android@v3

      - name: Instalar SDK 35
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0" "platform-tools"

      - name: Configurar Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Compilar APK
        run: gradle assembleDebug --stacktrace

      - name: Preparar nome do APK
        run: cp app/build/outputs/apk/debug/app-debug.apk Ilha-dos-Lacos.apk

      - name: Disponibilizar APK
        uses: actions/upload-artifact@v4
        with:
          name: Ilha-dos-Lacos-APK
          path: Ilha-dos-Lacos.apk
          if-no-files-found: error
