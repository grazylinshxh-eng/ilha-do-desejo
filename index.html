function dbEventToEvent(e){ return {id:e.id,title:e.title,description:e.description||"",startsAt:e.starts_at,deadline:e.deadline, reminderMinutes:Number(e.reminder_minutes||60),active:e.active!==false,createdAt:e.created_at};
}
async function cloudLoad(role,userId){ const s=await ensureCloud(); if(!s)throw new Error("Supabase não configurado."); const [pr,er,vr]=await Promise.all([ s.from("profiles").select("*").order("display_name"), s.from("events").select("*").order("starts_at",{ascending:true}), s.from("votes").select("*") ]); if(pr.error)throw pr.error;if(er.error)throw er.error;if(vr.error)throw vr.error; const out=blankData(); out.players=(pr.data||[]).map(dbProfileToPlayer); out.events=(er.data||[]).map(dbEventToEvent); out.votes={}; for(const v of (vr.data||[])){ out.votes[v.from_user]||={}; out.votes[v.from_user][v.to_user]={score:Number(v.score),updatedAt:v.updated_at}; } out.eventState={}; if(role==="player"){ const st=await s.from("player_event_state").select("*").eq("user_id",userId); if(st.error)throw st.error; out.eventState[userId]={}; for(const x of (st.data||[]))out.eventState[userId][x.event_id]={seenAt:x.seen_at,remindedAt:x.reminded_at}; } data=out;dataSource="cloud"; if(role==="admin")await loadCloudInvites(); return out;
}
async function loadCloudInvites(){ const s=await ensureCloud(); if(!s)return; const r=await s.from("player_invites").select("*").order("created_at",{ascending:false}); pendingInvites=r.error?[]:(r.data||[]);
}
async function saveVote(from,to,score){ if(dataSource==="local"){localSetVote(from,to,score);return} const s=await ensureCloud(); const r=await s.from("votes").upsert({from_user:from,to_user:to,score:Number(score),updated_at:nowISO()},{onConflict:"from_user,to_user"}); if(r.error)throw r.error; data.votes[from]||={};data.votes[from][to]={score:Number(score),updatedAt:nowISO()};
}
async function saveCloudProfilePhoto(playerId,photo){ const s=await ensureCloud();const r=await s.from("profiles").update({photo_data:photo}).eq("id",playerId); if(r.error)throw r.error;
}
async function refreshCloudData(){ if(dataSource!=="cloud" || !current.role)return; await cloudLoad(current.role,current.playerId); rerender(); if(current.role==="player"){scheduleReminders(current.playerId);await checkDeadlineReminders(current.playerId)}
}
function clearRealtime(){ if(cloud)for(const ch of realtimeChannels)try{cloud.removeChannel(ch)}catch{} realtimeChannels=[];
}
async function setupRealtime(role,userId){ clearRealtime();const s=await ensureCloud();if(!s)return; const eventsCh=s.channel("events-live") .on("postgres_changes",{event:"INSERT",schema:"public",table:"events"},async payload=>{ if(role==="player")notifyUser("Novo evento na ilha",payload.new.title||"Um novo evento foi publicado."); await refreshCloudData(); }) .on("postgres_changes",{event:"UPDATE",schema:"public",table:"events"},refreshCloudData) .on("postgres_changes",{event:"DELETE",schema:"public",table:"events"},refreshCloudData) .subscribe(); realtimeChannels.push(eventsCh); if(role==="admin"){ const votesCh=s.channel("votes-live") .on("postgres_changes",{event:"*",schema:"public",table:"votes"},refreshCloudData) .on("postgres_changes",{event:"*",schema:"public",table:"profiles"},refreshCloudData) .subscribe(); realtimeChannels.push(votesCh); }else{ const profilesCh=s.channel("profiles-live") .on("postgres_changes",{event:"UPDATE",schema:"public",table:"profiles"},refreshCloudData) .subscribe(); realtimeChannels.push(profilesCh); }
} /* ========= LOGIN ========= */

async function loginAdmin(){ if(!cloudConfigured()){showLoginError("Servidor da temporada ainda não foi configurado.");return} const pass=document.getElementById("adminPassInput").value; if(cloudConfigured()){ try{ const email=document.getElementById("adminEmailInput").value.trim(); const s=await ensureCloud();const r=await s.auth.signInWithPassword({email,password:pass});if(r.error)throw r.error; const p=await s.from("profiles").select("*").eq("id",r.data.user.id).single(); if(p.error||p.data.role!=="admin"||p.data.active===false)throw new Error("Esta conta não possui perfil de administrador."); current={role:"admin",playerId:r.data.user.id,playerTab:"profile",adminTab:"dashboard",detailPlayerId:null}; await cloudLoad("admin",current.playerId);sessionStorage.setItem(SESSION_KEY,JSON.stringify({role:"admin",playerId:current.playerId,cloud:true})); await setupRealtime("admin",current.playerId);renderAdmin("dashboard"); }catch(e){showLoginError(e.message||"Não foi possível entrar como ADM.")} return; } data=loadLocal(); if(pass!==data.settings.adminPassword){showLoginError("Senha ADM incorreta.");return} current={role:"admin",playerId:"local_admin",playerTab:"profile",adminTab:"dashboard",detailPlayerId:null}; sessionStorage.setItem(SESSION_KEY,JSON.stringify({role:"admin",cloud:false}));renderAdmin("dashboard");
}
async function completeFirstAccess(){ if(!cloudConfigured()){showLoginError("Servidor da temporada ainda não foi configurado.");return} const code=document.getElementById("firstCodeInput").value.trim(); const username=document.getElementById("firstUsernameInput").value.trim(); const pass=document.getElementById("firstPasswordInput").value; const pass2=document.getElementById("firstPassword2Input").value; if(normalizeUsername(username).length<3){showLoginError("Crie um usuário com pelo menos 3 caracteres.");return} if(pass.length<6){showLoginError("A senha precisa ter pelo menos 6 caracteres.");return} if(pass!==pass2){showLoginError("As senhas não coincidem.");return} if(cloudConfigured()){ try{ const s=await ensureCloud();const email=usernameEmail(username); let auth=await s.auth.signUp({email,password:pass}); if(auth.error){ auth=await s.auth.signInWithPassword({email,password:pass}); if(auth.error)throw auth.error; } if(!auth.data.session)throw new Error("O Supabase está exigindo confirmação de e-mail. Desative 'Confirm email' para este projeto."); const claim=await s.rpc("claim_player_invite",{p_code:code,p_username:username}); if(claim.error)throw claim.error; if(firstPhotoData){ const u=await s.from("profiles").update({photo_data:firstPhotoData}).eq("id",auth.data.user.id);if(u.error)throw u.error; } current={role:"player",playerId:auth.data.user.id,playerTab:"profile",adminTab:"dashboard",detailPlayerId:null}; await cloudLoad("player",current.playerId);sessionStorage.setItem(SESSION_KEY,JSON.stringify({role:"player",playerId:current.playerId,cloud:true})); firstPhotoData="";await setupRealtime("player",current.playerId);renderPlayer("profile");scheduleReminders(current.playerId);startReminderLoop(); }catch(e){showLoginError(e.message||"Falha no primeiro acesso.")} return; } data=loadLocal(); const p=data.players.find(x=>x.active&&x.code===code&&x.firstLogin!==false); if(!p){showLoginError("Código inválido ou já utilizado.");return} if(data.players.some(x=>x.id!==p.id&&(x.username||"").toLowerCase()===username.toLowerCase())){showLoginError("Esse usuário já existe.");return} p.username=username;p.password=pass;p.photo=firstPhotoData||"";p.firstLogin=false;saveLocal();firstPhotoData=""; current={role:"player",playerId:p.id,playerTab:"profile",adminTab:"dashboard",detailPlayerId:null}; sessionStorage.setItem(SESSION_KEY,JSON.stringify({role:"player",playerId:p.id,cloud:false}));renderPlayer("profile");scheduleReminders(p.id);startReminderLoop();
}
async function logout(){ stopReminderLoop();clearRealtime(); if(cloudConfigured()&&cloud)try{await cloud.auth.signOut()}catch{} sessionStorage.removeItem(SESSION_KEY);current={role:null,playerId:null,playerTab:"profile",adminTab:"dashboard",detailPlayerId:null};renderLogin();
} /* ========= FOTO ========= */
function resizeImage(file,maxSize=420,quality=.74){ return new Promise((resolve,reject)=>{ const r=new FileReader();r.onload=()=>{ const img=new Image();img.onload=()=>{ const ratio=Math.min(1,maxSize/Math.max(img.width,img.height)); const c=document.createElement("canvas");c.width=Math.round(img.width*ratio);c.height=Math.round(img.height*ratio); c.getContext("2d").drawImage(img,0,0,c.width,c.height);resolve(c.toDataURL("image/jpeg",quality)); };img.onerror=reject;img.src=r.result; };r.onerror=reject;r.readAsDataURL(file); });
}
async function previewFirstPhoto(ev){ const f=ev.target.files?.[0];if(!f||!f.type.startsWith("image/"))return; firstPhotoData=await resizeImage(f);document.getElementById("firstPhotoPreview").innerHTML=`<img src="${firstPhotoData}" alt="Prévia">`;
}

}

}

function countdownInfo(e){ const now=Date.now(),start=new Date(e.startsAt).getTime(),end=new Date(e.deadline).getTime(); if(now>=end)return {text:"Prazo encerrado",pct:100,ended:true}; const d=end-now; const days=Math.floor(d/86400000),hrs=Math.floor((d%86400000)/3600000),mins=Math.floor((d%3600000)/60000); const text=days>0?`${days}d ${hrs}h restantes`:hrs>0?`${hrs}h ${mins}min restantes`:`${Math.max(0,mins)} min restantes`; const total=Math.max(1,end-start);const pct=Math.max(0,Math.min(100,((now-start)/total)*100)); return {text,pct,ended:false};
}

function toast(title,body){ const id=uid("toast"),root=document.getElementById("toastRoot"); root.insertAdjacentHTML("beforeend",`<div class="toast" id="${id}"><b>${esc(title)}</b><div class="muted">${esc(body||"")}</div></div>`); setTimeout(()=>document.getElementById(id)?.remove(),4500);

function notifyUser(title,body){ toast(title,body); try{ if(window.AndroidNotify){window.AndroidNotify.notifyNow(title,body);return} if("Notification"in window&&Notification.permission==="granted")new Notification(title,{body}); }catch{}
}
async function requestNotificationPermission(){ try{if(window.AndroidNotify)window.AndroidNotify.requestPermission()}catch{} if("Notification"in window){ try{const p=await Notification.requestPermission();toast("Notificações",p==="granted"?"Ativadas neste dispositivo.":"Permissão não concedida.")}catch{} }else toast("Notificações","O navegador não oferece notificações do sistema.");
}
async function markEventsSeen(playerId){ const active=data.events.filter(e=>e.active); data.eventState[playerId]||={}; if(dataSource==="local"){ for(const e of active)data.eventState[playerId][e.id]={...eventState(playerId,e.id),seenAt:nowISO()}; saveLocal();return; } const s=await ensureCloud(); for(const e of active){ const st=eventState(playerId,e.id),seenAt=st.seenAt||nowISO(); const r=await s.from("player_event_state").upsert({user_id:playerId,event_id:e.id,seen_at:seenAt,reminded_at:st.remindedAt||null},{onConflict:"user_id,event_id"}); if(!r.error){data.eventState[playerId]||={};data.eventState[playerId][e.id]={seenAt,remindedAt:st.remindedAt||null}} }
}
async function markReminder(playerId,eventId){ data.eventState[playerId]||={};const st=eventState(playerId,eventId),ts=nowISO(); data.eventState[playerId][eventId]={seenAt:st.seenAt||null,remindedAt:ts}; if(dataSource==="local"){saveLocal();return} const s=await ensureCloud();await s.from("player_event_state").upsert({user_id:playerId,event_id:eventId,seen_at:st.seenAt||null,reminded_at:ts},{onConflict:"user_id,event_id"});
}
async function checkDeadlineReminders(playerId){ if(current.role!=="player"||current.playerId!==playerId)return; const now=Date.now(); for(const e of data.events.filter(x=>x.active)){ const deadline=new Date(e.deadline).getTime(),at=deadline-Number(e.reminderMinutes||60)*60000,st=eventState(playerId,e.id); if(now>=at&&now<deadline&&!st.remindedAt){ notifyUser("Prazo terminando",`${e.title} termina ${fmt(e.deadline)}.`); await markReminder(playerId,e.id); } }
}
function scheduleReminders(playerId){ if(current.role!=="player"||!window.AndroidNotify)return; for(const e of data.events.filter(x=>x.active)){ const when=new Date(e.deadline).getTime()-Number(e.reminderMinutes||60)*60000; if(when>Date.now()){ try{window.AndroidNotify.schedule(e.id,"Prazo terminando",`${e.title} termina ${fmt(e.deadline)}.`,Math.floor(when))}catch{} } }
}
function startReminderLoop(){stopReminderLoop();reminderTimer=setInterval(()=>checkDeadlineReminders(current.playerId),60000);checkDeadlineReminders(current.playerId)}
function stopReminderLoop(){if(reminderTimer)clearInterval(reminderTimer);reminderTimer=null} /* ========= RESULTADOS ADM ========= */
function allConnections(){ const players=data.players.filter(p=>p.active&&p.role!=="admin"),out=[]; for(let i=0;i<players.length;i++)for(let j=i+1;j<players.length;j++){ const a=players[i],b=players[j],ab=getVote(a.id,b.id)?.score,ba=getVote(b.id,a.id)?.score; const complete=Number.isFinite(ab)&&Number.isFinite(ba),score=complete?Math.round((ab+ba)/2):null; out.push({a,b,ab,ba,complete,score,match:complete&&ab>=61&&ba>=61}); } return out.sort((x,y)=>(y.score??-1)-(x.score??-1));
}
function playerInsight(p){ const players=data.players.filter(x=>x.active&&x.role!=="admin"&&x.id!==p.id); const outgoing=players.map(x=>({player:x,score:getVote(p.id,x.id)?.score})).filter(x=>Number.isFinite(x.score)).sort((a,b)=>b.score-a.score); const incoming=players.map(x=>({player:x,score:getVote(x.id,p.id)?.score})).filter(x=>Number.isFinite(x.score)).sort((a,b)=>b.score-a.score); const matches=players.map(x=>{ const out=getVote(p.id,x.id)?.score,inc=getVote(x.id,p.id)?.score; return {player:x,out,inc,score:Number.isFinite(out)&&Number.isFinite(inc)?Math.round((out+inc)/2):null} }).filter(x=>Number.isFinite(x.out)&&Number.isFinite(x.inc)&&x.out>=61&&x.inc>=61).sort((a,b)=>b.score-a.score); return {outgoing,incoming,matches,outAvg:mean(outgoing.map(x=>x.score)),inAvg:mean(incoming.map(x=>x.score))};
}
function resultPlayerCard(p){ const i=playerInsight(p),top=i.matches[0]; return `<article class="result-player-card" onclick="renderAdmin('playerDetail','${p.id}')">
<div class="player-top">${avatarHTML(p,"sm")}<div style="flex:1"><b>${esc(p.name)}</b><div class="muted">@${esc(p.username||"player")}</div></div><span class="tag">Abrir →</span></div>
<div class="result-meta">
<div class="mini-stat"><strong>${i.inAvg}</strong><span class="muted">média recebida</span></div>
<div class="mini-stat"><strong>${i.outAvg}</strong><span class="muted">média dada</span></div>
<div class="mini-stat"><strong>${i.matches.length}</strong><span class="muted">matches</span></div>
</div> ${top?`<div class="muted" style="margin-top:10px">Top match: <b>${esc(top.player.name)}</b> • ${top.score}/100</div>`:""} </article>`;
}
function heatCell(score){ if(!Number.isFinite(score))return `<div class="heat-cell"><span class="muted">—</span></div>`; const pct=Math.max(8,Math.round(score)); return `<div class="heat-cell" style="background:color-mix(in srgb,var(--accent2) ${pct}%,var(--panel));"><div><div class="heat-score">${score}</div><div>${levelFor(score)}</div></div></div>`;
}
function heatmapHTML(){ const ps=data.players.filter(p=>p.active&&p.role!=="admin"); return `<div class="heatmap-wrap"><div class="heatmap" style="--cols:${ps.length}">
<div class="heat-row"><div class="heat-cell heat-head heat-name">Quem votou ↓</div>${ps.map(p=>`<div class="heat-cell heat-head">${esc(p.name)}</div>`).join("")}</div> ${ps.map(from=>`<div class="heat-row"><div class="heat-cell heat-name">${avatarHTML(from,"sm")}<span>${esc(from.name)}</span></div>${ps.map(to=>from.id===to.id?`<div class="heat-cell">•</div>`:heatCell(getVote(from.id,to.id)?.score)).join("")}</div>`).join("")} </div></div>
<div class="legend"><span>0–20 Curiosidade</span><span>21–40 Atração</span><span>41–60 Interesse</span><span>61–80 Conexão</span><span>81–100 Paixão</span></div>`;
}
function networkGraphHTML(){ const ps=data.players.filter(p=>p.active&&p.role!=="admin"),cons=allConnections().filter(c=>c.complete); if(ps.length<2)return `<div class="empty">Adicione pelo menos dois players.</div>`; const W=720,H=440,cx=W/2,cy=H/2,r=Math.min(170,70+ps.length*15); const pos={};ps.forEach((p,i)=>{const a=(Math.PI*2*i/ps.length)-Math.PI/2;pos[p.id]={x:cx+Math.cos(a)*r,y:cy+Math.sin(a)*r}}); const edges=cons.map(c=>{ const a=pos[c.a.id],b=pos[c.b.id],width=1+((c.score||0)/100)*6,op=.18+((c.score||0)/100)*.75; return `<line x1="${a.x}" y1="${a.y}" x2="${b.x}" y2="${b.y}" style="stroke:${c.match?"var(--accent3)":"var(--accent2)"};stroke-width:${width};opacity:${op}" />
<text x="${(a.x+b.x)/2}" y="${(a.y+b.y)/2-5}" text-anchor="middle" style="fill:var(--text);font-size:12px;font-weight:900">${c.score}</text>`; }).join(""); const nodes=ps.map(p=>{ const o=pos[p.id],label=(p.shape||p.name[0]||"♥").slice(0,2); return `<g onclick="renderAdmin('playerDetail','${p.id}')" style="cursor:pointer">
<circle cx="${o.x}" cy="${o.y}" r="32" style="fill:var(--panel);stroke:var(--accent);stroke-width:2"/>
<text x="${o.x}" y="${o.y-2}" text-anchor="middle" dominant-baseline="middle" style="fill:var(--text);font-size:19px">${esc(label)}</text>
<text x="${o.x}" y="${o.y+49}" text-anchor="middle" style="fill:var(--text);font-size:13px;font-weight:900">${esc(p.name)}</text>
</g>`; }).join(""); return `<div class="graph-wrap"><svg class="network-svg" viewBox="0 0 ${W} ${H}" role="img" aria-label="Mapa de conexões">${edges}${nodes}</svg></div>
<div class="muted" style="font-size:.78rem;margin-top:8px">Linhas mais grossas indicam conexão média maior. Linhas em destaque representam match: ambos deram 61 ou mais.</div>`;
} /* ========= ADM ========= */
function adminNav(active){ const a=active==="playerDetail"?"results":active; return `<div class="app-tabs"> ${[["dashboard","Visão geral"],["players","Players"],["events","Eventos"],["results","Resultados"],["settings","Configurações"]].map(([id,label])=>`<button class="tab-btn ${a===id?"active":""}" onclick="renderAdmin('${id}')">${label}</button>`).join("")} </div>`;
}
function adminTopbar(){ return `<div class="topbar"><div class="brand"><div class="brand-mark">♛</div> Ilha do Desejo — ADM</div><div class="top-actions"><span class="badge"><span class="status-dot ${dataSource==="cloud"?"on":""}"></span>${cloudLabel()}</span><button class="btn small ghost" onclick="logout()">Sair</button></div></div>`;
}
function totalVotes(){let n=0;Object.values(data.votes||{}).forEach(x=>n+=Object.keys(x||{}).length);return n}
function renderAdmin(tab="dashboard",detailId=null){ current.adminTab=tab;current.detailPlayerId=detailId||null;showOnly("adminView"); let content=""; if(tab==="dashboard")content=adminDashboardHTML(); if(tab==="players")content=adminPlayersHTML(); if(tab==="events")content=adminEventsHTML(); if(tab==="results")content=adminResultsHTML(); if(tab==="playerDetail")content=adminPlayerDetailHTML(detailId); if(tab==="settings")content=adminSettingsHTML(); document.getElementById("adminView").innerHTML=`${adminTopbar()}${adminNav(tab)}<main class="page-window">${content}</main><div class="footer">Resultados e votos recebidos são visíveis somente para administradores.</div>`;
}
function adminDashboardHTML(){ const ps=data.players.filter(p=>p.active&&p.role!=="admin"),cons=allConnections(),matches=cons.filter(c=>c.match); return `<div class="stats">
<div class="stat"><span class="muted">Players ativos</span><strong>${ps.length}</strong></div>
<div class="stat"><span class="muted">Votos registrados</span><strong>${totalVotes()}</strong></div>
<div class="stat"><span class="muted">Eventos ativos</span><strong>${data.events.filter(e=>e.active).length}</strong></div>
<div class="stat"><span class="muted">Matches</span><strong>${matches.length}</strong></div>
</div>
<div class="grid cols-2" style="margin-top:16px">
<section class="card section"><div class="hero-kicker">Rede</div><h2>Mapa rápido de conexões</h2>${networkGraphHTML()}</section>
<section class="card section"><div class="hero-kicker">Prazos</div><h2>Eventos mais próximos</h2><div class="stack"> ${data.events.filter(e=>e.active).sort((a,b)=>new Date(a.deadline)-new Date(b.deadline)).slice(0,4).map(e=>{const c=countdownInfo(e);return `<div class="event-card"><b>${esc(e.title)}</b><div class="deadline">${esc(c.text)}</div><div class="muted">${esc(fmt(e.deadline))}</div></div>`}).join("")||`<div class="empty">Sem eventos ativos.</div>`} </div></section>
</div>`;
}
function adminPlayersHTML(){ const players=data.players.filter(p=>p.role!=="admin"); return `<div class="grid cols-2">
<section class="card section">
<div class="hero-kicker">Acesso</div><h2>Criar convite de player</h2>
<div class="form-grid">
<label>Nome de exibição<input id="inviteName" placeholder="Nome do participante"></label>
<label>Shape / símbolo<input id="inviteShape" placeholder="Ex.: 🌙"></label>
<label>Código de primeiro acesso<input id="inviteCode" placeholder="Deixe vazio para gerar"></label>
<button class="btn primary" onclick="addPlayerInvite()">Gerar convite</button>
<div id="playerFormMsg" class="error"></div>
</div> ${dataSource==="cloud"?`<div class="notice" style="margin-top:14px">Na nuvem, o cadastro definitivo é criado quando o player usa o convite no primeiro acesso.</div>`:""} </section>
<section class="card section"><div class="hero-kicker">Participantes</div><h2>Players cadastrados</h2><div class="stack"> ${players.map(p=>`<div class="player-card"><div class="player-top">${avatarHTML(p,"sm")}<div style="flex:1"><b>${esc(p.name)}</b><div class="muted">${p.firstLogin?`Código: <span class="code">${esc(p.code)}</span>`:`@${esc(p.username||"—")}`}</div></div><button class="btn small ${p.active?"danger":"secondary"}" onclick="togglePlayer('${p.id}')">${p.active?"Desativar":"Ativar"}</button></div></div>`).join("")||`<div class="empty">Nenhum player cadastrado.</div>`} </div></section>
</div> ${dataSource==="cloud"?`<section class="card section" style="margin-top:16px"><div class="hero-kicker">Pendentes</div><h2>Convites ainda não utilizados</h2><div class="stack">${pendingInvites.filter(i=>i.active&& !i.claimed_by).map(i=>`<div class="player-card"><div class="split"><div><b>${esc(i.display_name)}</b><div class="muted">Código: <span class="code">${esc(i.code)}</span> • ${esc(i.shape||"♥")}</div></div><button class="btn small danger" onclick="revokeInvite('${i.id}')">Revogar</button></div></div>`).join("")||`<div class="empty">Nenhum convite pendente.</div>`}</div></section>`:""}`;
}
function adminEventsHTML(){ return `<div class="grid cols-2">
<section class="card section">
<div class="hero-kicker">Exclusivo ADM</div><h2>Criar evento</h2>
<div class="form-grid">
<label>Título<input id="eventTitle" placeholder="Ex.: Encontro no mirante"></label>
<label>Início<input id="eventStart" type="datetime-local"></label>
<label>Prazo final<input id="eventDeadline" type="datetime-local"></label>
<label>Lembrete<select id="eventReminder"><option value="15">15 min antes</option><option value="30">30 min antes</option><option value="60" selected>1 hora antes</option><option value="180">3 horas antes</option><option value="720">12 horas antes</option><option value="1440">1 dia antes</option></select></label>
<label>Descrição<textarea id="eventDescription" placeholder="O que os players precisam saber?"></textarea></label>
<button class="btn secondary" onclick="addEvent()">Publicar evento</button><div id="eventFormMsg" class="error"></div>
</div>
</section>
<section class="card section"><div class="hero-kicker">Agenda</div><h2>Gerenciar eventos</h2><div class="stack"> ${data.events.sort((a,b)=>new Date(a.deadline)-new Date(b.deadline)).map(e=>{const c=countdownInfo(e);return `<article class="event-card"><div class="event-time">${e.active?"ATIVO":"ENCERRADO"} • ${esc(fmt(e.startsAt))}</div><h3 style="margin:6px 0">${esc(e.title)}</h3><p class="muted">${esc(e.description||"")}</p><div class="deadline">Prazo: ${esc(fmt(e.deadline))} • ${esc(c.text)}</div><div class="row" style="margin-top:10px"><button class="btn small" onclick="toggleEvent('${e.id}')">${e.active?"Encerrar":"Reabrir"}</button><button class="btn small danger" onclick="deleteEvent('${e.id}')">Excluir</button></div></article>`}).join("")||`<div class="empty">Nenhum evento criado.</div>`} </div></section>
</div>`;
}
function adminResultsHTML(){ const ps=data.players.filter(p=>p.active&&p.role!=="admin"); return `<section class="card section">
<div class="split"><div><div class="hero-kicker">Resultados por pessoa</div><h2>Players e conexões</h2><p class="muted">Clique em um perfil para abrir interesses, quem se interessou e matches.</p></div><button class="btn small" onclick="exportData()">Exportar</button></div>
<div class="grid cols-2">${ps.map(resultPlayerCard).join("")||`<div class="empty">Sem players ativos.</div>`}</div>
</section>
<section class="card section" style="margin-top:16px"><div class="hero-kicker">Mapa gráfico</div><h2>Rede de conexões</h2>${networkGraphHTML()}</section>
<section class="card section" style="margin-top:16px"><div class="hero-kicker">Leitura visual</div><h2>Mapa de calor dos votos</h2><p class="muted">Linhas = quem deu a nota. Colunas = quem recebeu.</p>${heatmapHTML()}</section>`;
}
function scoreListHTML(items,empty){ return items.map(x=>`<div class="connection-card"><div class="player-top">${avatarHTML(x.player,"sm")}<div style="flex:1"><b>${esc(x.player.name)}</b><div class="muted">${levelFor(x.score)}</div></div><span class="tag">${x.score}/100</span></div><div class="meter"><span style="width:${x.score}%"></span></div></div>`).join("")||`<div class="empty">${esc(empty)}</div>`;
}
function adminPlayerDetailHTML(id){ const p=data.players.find(x=>x.id===id);if(!p)return `<div class="empty">Player não encontrado.</div>`; const i=playerInsight(p); return `<div class="backline"><button class="btn small ghost" onclick="renderAdmin('results')">← Resultados</button><div><b>Detalhes de ${esc(p.name)}</b><div class="muted">Aba privada do ADM</div></div></div>
<section class="card section"><div class="profile-head">${avatarHTML(p,"lg")}<div><div class="hero-kicker">Perfil de conexão</div><h2>${esc(p.name)}</h2><div class="row"><span class="tag">Média recebida ${i.inAvg}</span><span class="tag">Média dada ${i.outAvg}</span><span class="tag">${i.matches.length} matches</span></div></div></div></section>
<div class="grid cols-3" style="margin-top:16px">
<section class="card section"><div class="hero-kicker">Interesses</div><h2>Quem ${esc(p.name)} escolheu</h2><div class="stack">${scoreListHTML(i.outgoing,"Nenhum voto dado.")}</div></section>
<section class="card section"><div class="hero-kicker">Recebidos</div><h2>Quem se interessa por ${esc(p.name)}</h2><div class="stack">${scoreListHTML(i.incoming,"Nenhum voto recebido.")}</div></section>
<section class="card section"><div class="hero-kicker">Recíprocos</div><h2>Matches</h2><div class="stack">${i.matches.map(x=>`<div class="connection-card"><div class="player-top">${avatarHTML(x.player,"sm")}<div style="flex:1"><b>${esc(x.player.name)}</b><div class="muted">${x.out} ↔ ${x.inc}</div></div><span class="tag">${x.score}/100</span></div><div class="meter"><span style="width:${x.score}%"></span></div></div>`).join("")||`<div class="empty">Nenhum match (ambos precisam marcar 61+).</div>`}</div></section>
</div>`;
}
function adminSettingsHTML(){ const theme=localStorage.getItem(THEME_KEY)||"system"; return `<div class="grid cols-2">
<section class="card section"><div class="hero-kicker">Aparência</div><h2>Tema do aplicativo</h2><label>Modo<select onchange="setTheme(this.value)"><option value="system" ${theme==="system"?"selected":""}>Seguir sistema</option><option value="light" ${theme==="light"?"selected":""}>Claro</option><option value="dark" ${theme==="dark"?"selected":""}>Escuro</option></select></label></section>
<section class="card section"><div class="hero-kicker">Nuvem</div><h2>Sincronização</h2><div class="cloud-status"><span class="status-dot ${dataSource==="cloud"?"on":""}"></span><b>${cloudLabel()}</b></div><p class="muted">O servidor desta temporada já fica configurado dentro do aplicativo. Jogadores não precisam informar URL ou chave.</p></section>
</div>
<details class="settings-box"><summary>Dados e diagnóstico</summary><div class="stack">
<div class="notice">Versão: <span class="code">${APP_VERSION}</span> • Backend: ${cloudConfigured()?"Supabase embutido":"não configurado"}</div>
<div class="row"><button class="btn small" onclick="exportData()">Exportar JSON</button></div>
</div></details>`;
} /* ========= AÇÕES ADM ========= */
async function addPlayerInvite(){ const name=document.getElementById("inviteName").value.trim(),shape=document.getElementById("inviteShape").value.trim()||"♥"; let code=document.getElementById("inviteCode").value.trim()||generateAccessCode();const msg=document.getElementById("playerFormMsg"); if(!name){msg.textContent="Informe o nome.";return} if(dataSource==="local"){ if(data.players.some(p=>p.name.toLowerCase()===name.toLowerCase())){msg.textContent="Esse nome já está em uso.";return} if(data.players.some(p=>p.code===code))code=generateAccessCode(); data.players.push({id:uid("p"),name,shape,code,active:true,username:"",password:"",firstLogin:true,photo:"",role:"player"});saveLocal();renderAdmin("players");return; } try{ const s=await ensureCloud();const r=await s.from("player_invites").insert({code,display_name:name,shape,active:true,created_by:current.playerId});if(r.error)throw r.error; await loadCloudInvites();renderAdmin("players");toast("Convite criado",`${name}: ${code}`); }catch(e){msg.textContent=e.message||"Falha ao criar convite."}
}
async function revokeInvite(id){ if(dataSource!=="cloud")return;const s=await ensureCloud();await s.from("player_invites").update({active:false}).eq("id",id);await loadCloudInvites();renderAdmin("players");
}
async function togglePlayer(id){ const p=data.players.find(x=>x.id===id);if(!p)return; p.active=!p.active; if(dataSource==="local"){saveLocal();renderAdmin("players");return} const s=await ensureCloud();const r=await s.from("profiles").update({active:p.active}).eq("id",id);if(r.error){p.active=!p.active;toast("Erro",r.error.message)}renderAdmin("players");
}
async function addEvent(){ const title=document.getElementById("eventTitle").value.trim(),startVal=document.getElementById("eventStart").value,deadlineVal=document.getElementById("eventDeadline").value; const desc=document.getElementById("eventDescription").value.trim(),rem=Number(document.getElementById("eventReminder").value),msg=document.getElementById("eventFormMsg"); if(!title||!startVal||!deadlineVal){msg.textContent="Preencha título, início e prazo.";return} const startsAt=new Date(startVal).toISOString(),deadline=new Date(deadlineVal).toISOString(); if(new Date(deadline)<=new Date(startsAt)){msg.textContent="O prazo precisa ser posterior ao início.";return} if(dataSource==="local"){ data.events.push({id:uid("e"),title,description:desc,startsAt,deadline,reminderMinutes:rem,active:true,createdAt:nowISO()});saveLocal();renderAdmin("events");return; } try{ const s=await ensureCloud();const r=await s.from("events").insert({title,description:desc,starts_at:startsAt,deadline,reminder_minutes:rem,active:true,created_by:current.playerId});if(r.error)throw r.error; await refreshCloudData();renderAdmin("events"); }catch(e){msg.textContent=e.message||"Falha ao publicar evento."}
}
async function toggleEvent(id){ const e=data.events.find(x=>x.id===id);if(!e)return;e.active=!e.active; if(dataSource==="local"){saveLocal();renderAdmin("events");return} const s=await ensureCloud();const r=await s.from("events").update({active:e.active}).eq("id",id);if(r.error)e.active=!e.active;renderAdmin("events");
}
async function deleteEvent(id){ if(!confirm("Excluir este evento?"))return; if(dataSource==="local"){data.events=data.events.filter(e=>e.id!==id);saveLocal();renderAdmin("events");return} const s=await ensureCloud();const r=await s.from("events").delete().eq("id",id);if(r.error){toast("Erro",r.error.message);return}await refreshCloudData();renderAdmin("events");
}
function changeLocalAdminPassword(){ const p=document.getElementById("newAdminPassword").value;if(p.length<6){toast("Senha","Use pelo menos 6 caracteres.");return} data.settings.adminPassword=p;saveLocal();toast("Senha alterada","Nova senha local salva neste aparelho.");
}
function saveCloudSettingsFromAdmin(){ toast("Configuração embutida","A URL e a chave pública são definidas na compilação da V4.1.");
}
function resetLocal(){if(!confirm("Apagar todos os dados locais?"))return;localStorage.removeItem(LOCAL_KEY);data=loadLocal();renderAdmin("dashboard")}
function exportData(){ const blob=new Blob([JSON.stringify({source:dataSource,version:APP_VERSION,data},null,2)],{type:"application/json"}),a=document.createElement("a"); a.href=URL.createObjectURL(blob);a.download=`ilha-dos-lacos-${dataSource}.json`;a.click();URL.revokeObjectURL(a.href);
} /* ========= RENDER / RESUME ========= */
function rerender(){ if(current.role==="player")renderPlayer(current.playerTab); else if(current.role==="admin")renderAdmin(current.adminTab,current.detailPlayerId); else renderLogin();
}
async function resume(){ initTheme(); let s=null;try{s=JSON.parse(sessionStorage.getItem(SESSION_KEY)||"null")}catch{} if(cloudConfigured()){ try{ const c=await ensureCloud();const sess=await c.auth.getSession(); if(sess.data.session){ const prof=await c.from("profiles").select("*").eq("id",sess.data.session.user.id).single(); if(!prof.error&&prof.data.active!==false){ const role=prof.data.role; current={role,playerId:prof.data.id,playerTab:"profile",adminTab:"dashboard",detailPlayerId:null}; await cloudLoad(role,prof.data.id);await setupRealtime(role,prof.data.id); if(role==="admin")renderAdmin("dashboard");else{renderPlayer("profile");scheduleReminders(prof.data.id);startReminderLoop()} return; } } }catch(e){console.warn("Cloud resume:",e)} } dataSource=cloudConfigured()?"cloud":"local";data=loadLocal(); renderLogin();
}
window.addEventListener("storage",ev=>{ if(dataSource==="local"&&(ev.key===LOCAL_KEY||ev.key===LEGACY_KEY)){data=loadLocal();rerender()}
});
resume();
</script>
